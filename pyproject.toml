[project]
name = "capstone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<2.4",
    "openai>=1.40.0",
    "pandas>=2.2,<3",
    "psycopg2-binary>=2.9.12",
    "sentence-transformers>=3.4.0",
    "torch>=2.6",
    "pgvector>=0.4.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "cvxpy>=1.6.0",
    "strands-agents>=1.40",
    "boto3>=1.35",
    "botocore[crt]>=1.35",
    "pillow>=12.2.0",
    "pyparsing>=3.3.2",
    "ipywidgets>=8.1.8",
    "rdflib>=7.6.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "rapidfuzz>=3.14.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

notebook = [
    "ingredient-parser-nlp>=2.7.0",
    "ipykernel>=7.2.0",
    "nbformat>=5.10.0",
    "matplotlib>=3.10.9",
    "matplotlib-inline>=0.2.2",
    "plotly>=6.0.0",
]

pipeline = [
    "ingredient-parser-nlp>=2.7.0",
    "pdfplumber>=0.11.9",
    "rapidfuzz>=3.14.5",
    "faiss-cpu>=1.9.0",
    "scikit-learn>=1.6.0",
    "pyarrow>=19.0.0",
    "tqdm>=4.67.0",
    "mlflow>=3",
    "networkx>=3.6.1",
]

ec2 = [
    "ingredient-parser-nlp>=2.7.0",
    "rapidfuzz>=3.14.5",
    "faiss-cpu>=1.9.0",
    "scikit-learn>=1.6.0",
    "pyarrow>=19.0.0",
    "tqdm>=4.67.0",
    "networkx>=3.6.1",
    "transformers>=4.51.0,<5",
    "accelerate>=1.4.0",
    "bitsandbytes>=0.45.0",
    "lm-format-enforcer>=0.10.0",
    "nest-asyncio>=1.6.0",
    "psutil>=6.0.0",
    "vllm>=0.8.0,<0.9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
